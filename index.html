<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy. This is a static, backendless app: the only code
      that should run is our own bundle (script-src 'self'), the Google Identity
      Services and Google Picker scripts, and the self-hosted tesseract.js WASM
      worker ('wasm-unsafe-eval' + worker-src blob:). No 'unsafe-inline' /
      'unsafe-eval' in script-src. The Google origins below are what GIS sign-in
      and the Drive Picker need; verify on the live GitHub Pages deploy and
      widen a directive only if the browser console reports a real violation.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               form-action 'self';
               script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://apis.google.com https://*.gstatic.com;
               style-src 'self' 'unsafe-inline' https://accounts.google.com;
               img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com https://*.google.com;
               font-src 'self' data:;
               connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://sheets.googleapis.com https://content.googleapis.com https://*.googleusercontent.com;
               frame-src 'self' https://accounts.google.com https://content.googleapis.com https://docs.google.com https://drive.google.com;
               worker-src 'self' blob:;
               child-src 'self' blob:;
               manifest-src 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="description" content="Scan a receipt and split the bill." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131311" />
    <title>SnapSplit</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Restores the real path after the public/404.html SPA fallback redirect. -->
    <script src="%BASE_URL%spa-restore.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
